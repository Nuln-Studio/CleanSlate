name: Bug故障反馈
description: 程序运行报错、异常闪退、功能不正常等问题
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请完整填写下面信息，信息不全可能会延迟排查进度
  - type: input
    id: system-version
    attributes:
      label: 操作系统版本
      description: Windows版本，例如 Win10 22H2 / Win11 24H2
    validations:
      required: true
  - type: input
    id: program-version
    attributes:
      label: CleanSlate程序版本
      description: 填写使用的打包版本号
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 复现步骤
      description: 一步步写出怎么操作能稳定复现问题
    validations:
      required: true
  - type: textarea
    id: actual-error
    attributes:
      label: 实际出现的错误现象
      description: 报错弹窗、闪退、日志报错、异常行为
    validations:
      required: true
  - type: textarea
    id: expect-behavior
    attributes:
      label: 预期正常效果
    validations:
      required: true
  - type: textarea
    id: log-info
    attributes:
      label: 日志/截图补充
      description: 粘贴报错日志、上传截图，无则可不填
    validations:
      required: false