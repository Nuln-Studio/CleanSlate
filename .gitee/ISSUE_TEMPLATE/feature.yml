name: 功能优化与新增建议
description: 新功能需求、现有功能改进、使用体验优化
title: "[功能建议]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈需求，描述越详细越方便落地开发
  - type: textarea
    id: related-pain
    attributes:
      label: 现有痛点
      description: 当前使用有哪些不便、缺失了什么能力
    validations:
      required: true
  - type: textarea
    id: ideal-function
    attributes:
      label: 想要的功能细节
      description: 描述功能该如何使用、实现逻辑
    validations:
      required: true
  - type: textarea
    id: alternative-way
    attributes:
      label: 目前临时替代方案
      description: 有没有勉强能用的变通办法
    validations:
      required: false
  - type: textarea
    id: extra-desc
    attributes:
      label: 补充说明、参考截图
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: 开发参与意愿
      options:
        - label: 愿意参与代码编写，提交PR贡献代码
          required: false